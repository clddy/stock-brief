<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미국주식 브리핑</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --ink: #1d1d1f;
    --ink2: #6e6e73;
    --ink3: #aeaeb2;
    --line: rgba(0,0,0,.08);
    --up: #d70015;
    --down: #0066cc;
    --up-bg: rgba(215,0,21,.09);
    --down-bg: rgba(0,102,204,.09);
    --header-bg: rgba(245,245,247,.72);
    --shadow: 0 1px 3px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
    --accent: #0071e3;
    --cost: #c7c7cc;
    --profit: #34C759;
    --outflow: #FF3B30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --ink: #f5f5f7;
      --ink2: #98989d;
      --ink3: #636366;
      --line: rgba(255,255,255,.1);
      --up: #ff453a;
      --down: #0a84ff;
      --up-bg: rgba(255,69,58,.14);
      --down-bg: rgba(10,132,255,.14);
      --header-bg: rgba(0,0,0,.6);
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --accent: #0a84ff;
      --cost: #48484a;
      --profit: #30D158;
      --outflow: #FF453A;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 15px; line-height: 1.45;
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg);
    backdrop-filter: blur(20px) saturate(1.8);
    -webkit-backdrop-filter: blur(20px) saturate(1.8);
    border-bottom: 1px solid var(--line);
  }
  .hwrap {
    max-width: 1140px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .meta { font-size: 12.5px; color: var(--ink2); }
  .counts { display:flex; gap:10px; font-size:13px; font-weight:600; }
  .counts .u { color: var(--up); }
  .counts .d { color: var(--down); }
  .counts .f { color: var(--ink2); }
  .spacer { flex: 1; }
  input[type=search] {
    appearance: none; border: none; outline: none;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 99px; font-size: 14px; width: 190px;
    font-family: inherit;
  }
  input[type=search]:focus { border-color: var(--accent); }
  .seg {
    display: flex; background: var(--card); border: 1px solid var(--line);
    border-radius: 99px; overflow: hidden;
  }
  .seg button {
    appearance: none; border: none; background: none; color: var(--ink2);
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #fff; }
  .favbtn {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink2);
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 99px;
    cursor: pointer; display: flex; align-items: center; gap: 5px;
  }
  .favbtn.on { background: #FFCC00; color: #3a2f00; border-color: #FFCC00; }
  .fav { cursor: pointer; color: var(--ink3); line-height: 1; user-select: none; }
  .fav.on { color: #FFCC00; }
  .card .fav { font-size: 16px; }
  .mhead .fav { font-size: 20px; }

  main { max-width: 1140px; margin: 0 auto; padding: 24px; }

  .movers { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 26px; }
  .movers::-webkit-scrollbar { height: 0; }
  .chip {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 9px 14px; box-shadow: var(--shadow);
    cursor: pointer;
  }
  .chip b { font-size: 14px; }
  .chip span { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

  h2 {
    font-size: 17px; font-weight: 700; letter-spacing: -.01em;
    margin: 30px 0 12px; display: flex; align-items: baseline; gap: 8px;
  }
  h2 small { font-size: 12px; font-weight: 500; color: var(--ink3); }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 16px 12px;
    box-shadow: var(--shadow);
    transition: transform .15s ease;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-1px); }
  .card .top { display: flex; align-items: baseline; gap: 8px; }
  .card .tkr { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .card .kr {
    font-size: 12px; color: var(--ink2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .card .row2 { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .card .price { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .pill {
    font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 3px 9px; border-radius: 99px;
  }
  .pill.u { color: var(--up); background: var(--up-bg); }
  .pill.d { color: var(--down); background: var(--down-bg); }
  .spark { display: block; width: 100%; height: 44px; margin-top: 8px; cursor: crosshair; }
  .card .m1 { font-size: 11px; color: var(--ink3); margin-top: 4px; }
  .mfi { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .mfi.hot { color: var(--up); } .mfi.cold { color: var(--down); }
  .mfichart { display: block; width: 100%; height: 110px; margin-top: 6px; }
  .pxchart { display: block; width: 100%; height: 210px; margin-top: 6px; cursor: crosshair; }
  .pxcap { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .ichibtn { float: right; appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font: inherit; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; cursor: pointer; }
  .ichibtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ichileg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink2); margin-top: 6px; }
  .ichileg i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .ichichips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ichichip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--bg); color: var(--ink2); }
  .ichichip.u { background: var(--up-bg); color: var(--up); } .ichichip.d { background: var(--down-bg); color: var(--down); }
  .ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .nstock { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 6px; box-shadow: var(--shadow); }
  .nstock .nh { display: flex; align-items: baseline; gap: 8px; cursor: pointer; padding-bottom: 6px; }
  .nstock .nh .tkr { font-weight: 700; font-size: 15px; }
  .nstock .nh .kr { color: var(--ink2); font-size: 13px; flex: 1; }
  .nstock .nh b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .nstock .nh b.u { color: var(--up); } .nstock .nh b.d { color: var(--down); }
  .nstock a { display: block; padding: 7px 0; border-top: 1px solid var(--line); }
  .nstock a .ko { font-size: 13.5px; line-height: 1.4; }
  .nstock a:hover .ko { color: var(--accent); }
  .nstock .nm { font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .nstock .nm .fresh { color: var(--accent); font-weight: 600; }
  .nstock .none { font-size: 12px; color: var(--ink3); padding: 7px 0 8px; border-top: 1px solid var(--line); }
  .card .m1 b.u { color: var(--up); } .card .m1 b.d { color: var(--down); }
  .newsdot {
    display: inline-block; width: 6px; height: 6px; border-radius: 99px;
    background: var(--accent); vertical-align: 2px;
  }
  .cardnews { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; display: none; }
  .card.open .cardnews { display: block; }
  .cardnews a { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
  .cardnews a:hover { color: var(--accent); }
  .cardnews .src { color: var(--ink3); font-size: 11px; }

  .gnews {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 18px; box-shadow: var(--shadow);
    margin-bottom: 12px;
    column-count: 2; column-gap: 28px;
  }
  @media (max-width: 760px) { .gnews { column-count: 1; } }
  .gnews a {
    display: block; break-inside: avoid;
    font-size: 13px; padding: 5px 0;
  }
  .gnews a:hover { color: var(--accent); }
  .gnews .src { font-size: 11px; color: var(--ink3); display: block; }

  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .theme {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow);
  }
  .theme h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .theme a { display: block; font-size: 13px; margin-bottom: 9px; color: var(--ink); }
  .theme a:hover { color: var(--accent); }
  .theme .src { font-size: 11px; color: var(--ink3); display: block; margin-top: 1px; }
  .theme a .why, .gnews a .why { display: block; font-size: 11.5px; color: var(--accent); margin-top: 1px; }
  .theme .empty { font-size: 12.5px; color: var(--ink3); }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: right; padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--ink2); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
  td.u { color: var(--up); font-weight: 600; } td.d { color: var(--down); font-weight: 600; }
  tr:last-child td { border-bottom: none; }

  /* ---- detail modal ---- */
  .backdrop {
    position: fixed; inset: 0; z-index: 80; display: none;
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .backdrop.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 22px; width: 100%; max-width: 720px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden;
  }
  .modal .mhead {
    display: flex; align-items: baseline; gap: 10px;
    padding: 20px 24px 14px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--card);
  }
  .modal .mhead .tkr { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .modal .mhead .kr { font-size: 14px; color: var(--ink2); flex: 1; }
  .modal .mhead .price { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modal .mhead .pill { font-size: 13px; }
  .modal .mclose {
    appearance: none; border: none; background: var(--bg); color: var(--ink2);
    width: 30px; height: 30px; border-radius: 99px; font-size: 16px; cursor: pointer; line-height: 1;
  }
  .mbody { padding: 18px 24px 26px; }
  .mbody h4 {
    font-size: 14px; font-weight: 700; margin: 20px 0 4px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .mbody h4:first-child { margin-top: 0; }
  .mbody h4 small { font-size: 11px; font-weight: 500; color: var(--ink3); }
  .revchart { width: 100%; height: 250px; margin-top: 10px; display: block; }
  .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink2); margin-top: 6px; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .segrow { display: grid; grid-template-columns: 130px 1fr 118px; align-items: center; gap: 10px; margin: 7px 0; }
  .segrow .seglabel { font-size: 12.5px; line-height: 1.2; }
  .segrow .seglabel .segen { display: block; font-size: 10px; color: var(--ink3); }
  .segrow .segbar { height: 16px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .segrow .segbar i { display: block; height: 100%; border-radius: 5px; }
  .segrow .segval { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  .segrow .segval b { font-size: 13px; }
  .fintable { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  .fintable th, .fintable td { padding: 7px 8px; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .fintable th { color: var(--ink2); font-weight: 600; font-size: 11.5px; }
  .fintable td:first-child, .fintable th:first-child { text-align: left; color: var(--ink); font-weight: 600; }
  .fintable .qcol { color: var(--accent); }
  .fintable tr:last-child td { border-bottom: none; }
  .fintable td.neg { color: var(--down); }
  .balance-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .balance-grid .b { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .balance-grid .b .lbl { font-size: 11px; color: var(--ink2); }
  .balance-grid .b .val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .mnews a { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mnews a:last-child { border-bottom: none; }
  .mnews .ko { font-size: 13.5px; color: var(--ink); }
  .mnews .why { font-size: 12px; color: var(--accent); margin-top: 2px; }
  .mnews .en { font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .mnews a:hover .ko { color: var(--accent); }
  .fin-missing { font-size: 12.5px; color: var(--ink3); margin-top: 8px; }

  #tooltip {
    position: fixed; z-index: 99; pointer-events: none; display: none;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
    border-radius: 10px; padding: 6px 10px; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  #tooltip b { display: block; }

  footer { max-width: 1140px; margin: 40px auto 30px; padding: 0 24px; font-size: 12px; color: var(--ink3); }
  .hidden { display: none !important; }
</style>
</head>

<header>
  <div class="hwrap">
    <h1>미국주식 브리핑</h1>
    <div>
      <div class="counts"><span class="u">▲ <span id="cntUp">0</span></span><span class="d">▼ <span id="cntDown">0</span></span><span class="f">— <span id="cntFlat">0</span></span></div>
      <div class="meta" id="meta"></div>

    <input type="search" id="q" placeholder="종목 검색">

      <button data-v="cards" class="on">카드</button>

<main>
  <div id="movers" class="movers"></div>

  <div id="favEmpty" class="hidden" style="text-align:center;color:var(--ink3);padding:48px 20px;font-size:14px">즐겨찾기한 종목이 없습니다.<br>카드나 상세화면의 별(<span style="color:#FFCC00">★</span>)을 눌러 추가하세요.</div>
  <div id="cardsView"></div>
  <div id="tableView" class="hidden" style="margin-top:30px"></div>

</main>

<div id="tooltip"></div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>

<footer>

  데이터: Yahoo Finance(지연 시세 가능) · 뉴스: Google News RSS · 매일 아침 자동 갱신<br>
  표시 색상: <b style="color:var(--up)">빨강 = 상승</b> · <b style="color:var(--down)">파랑 = 하락</b> · 스파크라인은 선택 기간(1개월~1년) 종가. MFI(14) 80↑ 과매수·20↓ 과매도. 투자 판단은 본인 책임.
</footer>

const mfiZone = v => v == null ? "" : v >= 80 ? "hot" : v <= 20 ? "cold" : "";

// ---- 뉴스 시각: "3시간 전/2일 전", 48시간 이내면 새 뉴스
const newsAge = iso => { const t = Date.parse(iso || ""); return isNaN(t) ? null : (Date.now() - t) / 3600e3; };
const agoTxt = iso => { const h = newsAge(iso); if (h == null) return ""; if (h < 1) return "방금"; if (h < 24) return Math.floor(h) + "시간 전"; return Math.floor(h / 24) + "일 전"; };

const hasFresh = tk => Math.abs((byT[tk] || {}).chg || 0) >= 2.5 && ((D.ticker_news || {})[tk] || []).some(n => { const h = newsAge(n.time); return h != null && h <= 24; });
const mfiTxt = v => v == null ? "—" : (Math.round(v * 10) / 10).toFixed(v % 1 ? 1 : 0);
// 날짜: 구버전(dates 배열) 또는 압축(d0 시작일 + dd 일수 오프셋). UTC로 계산해 시간대 밀림 방지
function dateAt(x, i) {
  if (x.dates) return x.dates[i];
  const [y, m, d] = String(x.d0).split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + ((x.dd && x.dd[i]) || 0));
  return dt.toISOString().slice(0, 10);
}

// ---- 즐겨찾기 (localStorage). 보유종목(favorites.js, 로컬 전용)을 1회 병합 시드
const FAVS = new Set((() => {
  let cur = [];
  try { cur = JSON.parse(localStorage.getItem("sb_favs") || "[]"); } catch (e) {}
  const set = new Set(Array.isArray(cur) ? cur : []);
  try {
    // 아직 시드한 적 없으면 보유종목을 기존 즐겨찾기에 합침(수동 변경은 이후 존중)
    if (Array.isArray(window.DEFAULT_FAVS) && !localStorage.getItem("sb_favs_seeded")) {
      window.DEFAULT_FAVS.forEach(t => set.add(t));
      localStorage.setItem("sb_favs_seeded", "1");
      localStorage.setItem("sb_favs", JSON.stringify([...set]));
    }
  } catch (e) {}
  return set;
})());
let favOnly = false;
// 급등락 스트립: 즐겨찾기 먼저(등락률 절댓값 순) → 나머지 급등락으로 채움
function renderMovers() {
  const favs = all.filter(x => FAVS.has(x.t)).sort((a,b) => Math.abs(b.chg) - Math.abs(a.chg));
  const rest = all.filter(x => !FAVS.has(x.t)).sort((a,b) => Math.abs(b.chg) - Math.abs(a.chg));
  const n = Math.min(25, Math.max(12, favs.length));
  const shown = [...favs, ...rest].slice(0, n);
  $("#movers").innerHTML = shown.map(x => {
    const star = FAVS.has(x.t) ? `<span style="color:#FFCC00;font-size:11px;line-height:1">★</span>` : "";
    return `<div class="chip" data-goto="${x.t}">${star}<b>${x.t}</b><span class="${sign(x.chg)}" style="color:var(--${x.chg>=0?"up":"down"})">${chgTxt(x.chg)}</span></div>`;
  }).join("");
}
renderMovers();
function saveFavs() { try { localStorage.setItem("sb_favs", JSON.stringify([...FAVS])); } catch (e) {} }
function starHTML(t) { return `<span class="fav ${FAVS.has(t) ? "on" : ""}" data-fav="${t}" title="즐겨찾기">${FAVS.has(t) ? "★" : "☆"}</span>`; }
function syncStars(t) {
  document.querySelectorAll(`.fav[data-fav="${t}"]`).forEach(el => {
    const on = FAVS.has(t); el.classList.toggle("on", on); el.textContent = on ? "★" : "☆";

}
function toggleFav(t) {
  FAVS.has(t) ? FAVS.delete(t) : FAVS.add(t);
  saveFavs(); syncStars(t); renderMovers();

}

function segmentHTML(tk) {
  const s = SEG[tk]; if (!s) return "";
  if (s.single) {
    return `<h4>사업부문 <small>단일 사업</small></h4><div class="fin-missing">${s.note || "단일 사업부문 기업이라 부문별 매출 구분이 없습니다."}</div>`;
  }
  if (!s.seg || !s.seg.length) return "";
  const total = s.seg.reduce((a, x) => a + x[2], 0) || 1;
  const rows = s.seg.map((x, i) => {
    const [ko, en, val] = x;
    const pct = val / total * 100;
    const col = SEG_COLORS[i % SEG_COLORS.length];
    return `<div class="segrow">
      <div class="seglabel">${ko}<span class="segen">${en}</span></div>
      <div class="segbar"><i style="width:${pct.toFixed(1)}%;background:${col}"></i></div>
      <div class="segval"><b>${pct.toFixed(0)}%</b> · ${cur(val * 1e6)}</div>
    </div>`;
  }).join("");
  return `<h4>사업부문별 매출 <small>${s.period} · ${s.by} · 수작업 데이터</small></h4>${rows}
    <div style="font-size:11px;color:var(--ink3);margin-top:6px">공시(연차보고서) 기준 손입력. 최신 분기와 다를 수 있음.</div>`;
}

  return `<a href="${n.url}" target="_blank" rel="noopener">${koTitle(n)}${why}${src}</a>`;
}

// ---- sparkline
function sparkSVG(x) {
  const w = 240, h = 44, p = 3;
  const v = seriesOf(x).v;
  if (v.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${h}" data-t="${x.t}"></svg>`;
  const min = Math.min(...v), max = Math.max(...v), rng = (max - min) || 1;
  const px = i => p + i * (w - 2*p) / (v.length - 1);
  const py = c => h - p - (c - min) * (h - 2*p) / rng;
  const line = v.map((c,i) => `${i?"L":"M"}${px(i).toFixed(1)},${py(c).toFixed(1)}`).join("");
  const col = (chgOf(x) ?? 0) >= 0 ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" data-t="${x.t}" preserveAspectRatio="none">
    <path d="${line}L${w-p},${h}L${p},${h}Z" fill="${col}" opacity=".08" stroke="none"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${px(v.length-1)}" cy="${py(v[v.length-1])}" r="2.6" fill="${col}"/>
  </svg>`;
}

}

// ---- table view (정렬 가능)
function numFmt(v) {
  if (v == null) return "—";
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(1) + "B";
  if (a >= 1e6) return (v/1e6).toFixed(1) + "M";
  if (a >= 1e3) return (v/1e3).toFixed(0) + "K";
  return "" + v;
}
const tableRows = D.groups.flatMap(g => g.tickers.map(x => ({...x, g: g.name})));
const SORT_COLS = [
  {key:"t", label:"티커"}, {key:"kr", label:"이름"}, {key:"g", label:"그룹"},
  {key:"price", label:"종가"}, {key:"chg", label:"전일比"},
  {key:"chg1m", label:"1개월"}, {key:"chg3m", label:"3개월"},
  {key:"chg6m", label:"6개월"}, {key:"chg1y", label:"1년"}, {key:"mfi", label:"MFI(14)"},
  {key:"mcap", label:"시가총액"}, {key:"vol", label:"거래량"},
];
const STR_KEYS = new Set(["t", "kr", "g"]);
let sortState = { key: "chg", dir: "desc" };
function renderTable() {
  const { key, dir } = sortState, s = dir === "asc" ? 1 : -1;
  const rows = [...tableRows].sort((a, b) => {
    if (key === "g") {
      const c = String(a.g).localeCompare(String(b.g), "ko");
      return s * (c !== 0 ? c : String(a.t).localeCompare(String(b.t)));
    }
    if (STR_KEYS.has(key)) return s * String(a[key]).localeCompare(String(b[key]), "ko");
    const va = a[key], vb = b[key];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return s * (va - vb);
  });
  const head = SORT_COLS.map(c =>
    `<th data-sort="${c.key}" style="cursor:pointer;white-space:nowrap">${c.label}${c.key === key ? (dir === "asc" ? " ▲" : " ▼") : ""}</th>`
  ).join("");
  const body = rows.map(x => `<tr data-ticker="${x.t}" style="cursor:pointer" data-search="${x.t.toLowerCase()} ${x.kr}">
    <td><b>${x.t}</b></td><td>${x.kr}</td><td style="color:var(--ink2)">${x.g}</td>
    <td>$${fmt(x.price)}</td>
    <td class="${sign(x.chg)}">${chgTxt(x.chg)}</td>
    <td class="${sign(x.chg1m)}">${chgTxt(x.chg1m)}</td>
    <td class="${sign(x.chg3m)}">${chgTxt(x.chg3m)}</td>
    <td class="${sign(x.chg6m)}">${chgTxt(x.chg6m)}</td>
    <td class="${sign(x.chg1y)}">${chgTxt(x.chg1y)}</td>
    <td><span class="mfi ${mfiZone(x.mfi)}">${mfiTxt(x.mfi)}</span></td>
    <td>${x.mcap != null ? cur(x.mcap) : "—"}</td>
    <td>${numFmt(x.vol)}</td></tr>`).join("");
  $("#tableView").innerHTML = `<div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  applyFilter();
}
renderTable();
$("#tableView").addEventListener("click", e => {
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const k = th.dataset.sort;
    if (sortState.key === k) sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
    else sortState = { key: k, dir: STR_KEYS.has(k) ? "asc" : "desc" };
    renderTable();
    return;
  }
  const tr = e.target.closest("tr[data-ticker]");
  if (tr) openDetail(tr.dataset.ticker);
});

function applyFilter() {
  const q = $("#q").value.trim().toLowerCase();
  document.querySelectorAll("[data-search]").forEach(el => {
    const t = el.dataset.ticker;
    const okSearch = q === "" || el.dataset.search.includes(q);

    el.classList.toggle("hidden", !(okSearch && okFav));
  });

  });
  // 빈 상태(즐겨찾기 필터인데 아무것도 없을 때)
  const view = ["#cardsView", "#tableView", "#newsView"].find(v => !$(v).classList.contains("hidden")) || "#cardsView";
  const none = !document.querySelector(`${view} [data-ticker]:not(.hidden)`);
  $("#favEmpty").classList.toggle("hidden", !(favOnly && none));
}

// ---- detail modal
const backdrop = $("#backdrop"), modal = $("#modal");
function cur(v) {
  if (v == null) return "—";
  const a = Math.abs(v), s = v < 0 ? "-" : "";
  if (a >= 1e12) return s + "$" + (a/1e12).toFixed(2) + "T";
  if (a >= 1e9) return s + "$" + (a/1e9).toFixed(1) + "B";
  if (a >= 1e6) return s + "$" + (a/1e6).toFixed(0) + "M";
  return s + "$" + a.toFixed(0);
}
// 최근 회계연도 손익 흐름(워터폴): 어느 단계에서 얼마의 이익/비용이 발생하는지
function incomeSteps(an) {
  const i = an.periods.length - 1;  // 최신 회계연도
  const g = k => (an[k] && an[k][i] != null) ? an[k][i] : null;
  const rev = g("revenue"); if (rev == null || rev <= 0) return null;
  const cost = g("costOfRevenue"), gross = g("grossProfit");
  const rnd = g("rnd"), sga = g("sga"), op = g("operatingIncome");
  const tax = g("tax"), net = g("netIncome");
  const eps01 = rev * 0.01;
  const steps = [{ label: "매출", kind: "total", val: rev }];
  let base = rev;
  if (cost != null && cost > 0 && gross != null) {
    steps.push({ label: "매출원가", kind: "cost", val: cost });
    steps.push({ label: "매출총이익", kind: "sub", val: gross });
    base = gross;
  }
  if (op != null) {
    const opex = base - op;
    if ((rnd || 0) > 0 || (sga || 0) > 0) {
      if ((rnd || 0) > 0) steps.push({ label: "R&D", kind: "cost", val: rnd });
      if ((sga || 0) > 0) steps.push({ label: "판관비", kind: "cost", val: sga });
      const other = opex - (rnd || 0) - (sga || 0);
      if (other > eps01) steps.push({ label: "기타비용", kind: "cost", val: other });
    } else if (opex > eps01) {
      steps.push({ label: "영업비용", kind: "cost", val: opex });
    }
    steps.push({ label: "영업이익", kind: "sub", val: op });
    if (net != null) {
      const below = op - net;  // 세금 + 영업외 순액
      if ((tax || 0) > 0) {
        steps.push({ label: "법인세", kind: "cost", val: tax });
        const rest = below - tax;
        if (rest > eps01) steps.push({ label: "기타", kind: "cost", val: rest });
        else if (rest < -eps01) steps.push({ label: "기타수익", kind: "gain", val: -rest });
      } else if (below > eps01) {
        steps.push({ label: "세금·기타", kind: "cost", val: below });
      } else if (below < -eps01) {
        steps.push({ label: "기타수익", kind: "gain", val: -below });
      }
      steps.push({ label: "순이익", kind: "total", val: net });
    }
  } else if (net != null) {  // 영업이익 미제공(은행 등): 매출→비용·세금→순이익
    const ded = base - net;
    if (ded > eps01) steps.push({ label: "비용·세금", kind: "cost", val: ded });
    else if (ded < -eps01) steps.push({ label: "기타수익", kind: "gain", val: -ded });
    steps.push({ label: "순이익", kind: "total", val: net });
  }
  return steps;
}
function waterfallSVG(an) {
  const steps = incomeSteps(an); if (!steps) return "";
  // 1차: 각 단계 막대의 top/bot 계산 (적자=음수 지원)
  let running = 0;
  const geo = steps.map(st => {
    let top, bot, fill;
    if (st.kind === "total" || st.kind === "sub") {
      top = st.val; bot = 0; running = st.val;
      fill = st.val < 0 ? "var(--outflow)" : "var(--profit)";
    } else if (st.kind === "cost") {
      top = running; bot = running - st.val; running = bot; fill = "var(--outflow)";
    } else {  // gain
      top = running + st.val; bot = running; running = top; fill = "var(--profit)";
    }
    return { st, top, bot, fill };
  });

// ---- 상세 모달: 가격 차트 + 일목균형표(ON/OFF, 저장). 고가·저가는 chart/<티커>.js 를 열 때만 로드
const ICHI_COL = { tenkan: "#ff9500", kijun: "#5e5ce6", chikou: "#34c759" };
let ICHI_ON = (() => { try { return localStorage.getItem("sb_ichi") === "1"; } catch (e) { return false; } })();
const _ohlcP = {};
function loadOHLC(tk) {
  if (window.OHLC && window.OHLC[tk]) return Promise.resolve(window.OHLC[tk]);
  if (_ohlcP[tk]) return _ohlcP[tk];
  _ohlcP[tk] = new Promise((res, rej) => {
    const s = document.createElement("script");
    const v = (window.STOCK_VERSION && window.STOCK_VERSION.build) || Date.now();
    s.src = `chart/${encodeURIComponent(tk)}.js?v=${v}`;

// 전환선(9)·기준선(26)·선행스팬1/2(26일 앞으로)·후행스팬(26일 뒤로). 배열 인덱스 = 차트 x 위치(0..n+25)
function ichimoku(c, h, l) {
  const n = c.length;
  const H = h.map((v, i) => v == null ? c[i] : v), L = l.map((v, i) => v == null ? c[i] : v);
  const mid = (i, p) => {
    if (i < p - 1) return null;
    let hi = -Infinity, lo = Infinity;
    for (let k = i - p + 1; k <= i; k++) { if (H[k] > hi) hi = H[k]; if (L[k] < lo) lo = L[k]; }
    return (hi + lo) / 2;
  };
  const tenkan = new Array(n).fill(null), kijun = new Array(n).fill(null);
  const A = new Array(n + 26).fill(null), B = new Array(n + 26).fill(null), chikou = new Array(n).fill(null);
  for (let i = 0; i < n; i++) {
    tenkan[i] = mid(i, 9); kijun[i] = mid(i, 26);
    if (tenkan[i] != null && kijun[i] != null) A[i + 26] = (tenkan[i] + kijun[i]) / 2;
    const b = mid(i, 52); if (b != null) B[i + 26] = b;
    if (i >= 26) chikou[i - 26] = c[i];
  }
  return { tenkan, kijun, A, B, chikou };
}
function priceChartSVG(x, ich) {
  const c = x.spark, n = c.length, i0 = seriesOf(x).i0;
  const end = ich ? n - 1 + 26 : n - 1, span = Math.max(1, end - i0);
  const w = 600, hh = 210, p = 6;
  const vals = [];
  for (let i = i0; i < n; i++) vals.push(c[i]);
  if (ich) for (let i = i0; i <= end; i++) [ich.tenkan[i], ich.kijun[i], ich.A[i], ich.B[i], ich.chikou[i]].forEach(v => { if (v != null) vals.push(v); });
  const mn = Math.min(...vals), mx = Math.max(...vals), rng = (mx - mn) || 1;
  const X = i => (p + (i - i0) * (w - 2 * p) / span).toFixed(1);
  const Y = v => (hh - p - (v - mn) * (hh - 2 * p) / rng).toFixed(1);
  const path = (arr, from, to) => {
    let d = "", pen = false;
    for (let i = from; i <= to; i++) {
      const v = arr[i];
      if (v == null) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${X(i)},${Y(v)}`; pen = true;
    }
    return d;
  };
  const line = (d, col, wd, op) => d ? `<path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}" opacity="${op}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` : "";
  let g = "";
  if (ich) {
    for (let i = i0; i < end; i++) {
      const a0 = ich.A[i], b0 = ich.B[i], a1 = ich.A[i + 1], b1 = ich.B[i + 1];
      if (a0 == null || b0 == null || a1 == null || b1 == null) continue;
      const up = (a0 + a1) >= (b0 + b1);   // 양운(선행1 ≥ 선행2)=빨강, 음운=파랑 (한국식)
      g += `<polygon points="${X(i)},${Y(a0)} ${X(i + 1)},${Y(a1)} ${X(i + 1)},${Y(b1)} ${X(i)},${Y(b0)}" fill="${up ? "var(--up)" : "var(--down)"}" opacity=".14"/>`;
    }
    g += line(path(ich.A, i0, end), "var(--up)", 1, .5) + line(path(ich.B, i0, end), "var(--down)", 1, .5);
    g += `<line x1="${X(n - 1)}" x2="${X(n - 1)}" y1="0" y2="${hh}" stroke="var(--ink3)" stroke-dasharray="3 4" opacity=".7" vector-effect="non-scaling-stroke"/>`;
    g += line(path(ich.chikou, i0, n - 1), ICHI_COL.chikou, 1.3, .9);
    g += line(path(ich.kijun, i0, n - 1), ICHI_COL.kijun, 1.6, .95);
    g += line(path(ich.tenkan, i0, n - 1), ICHI_COL.tenkan, 1.6, .95);
  }
  const col = ich ? "var(--ink)" : ((chgOf(x) ?? 0) >= 0 ? "var(--up)" : "var(--down)");
  g += line(path(c, i0, n - 1), col, 2, 1);
  return { svg: `<svg class="pxchart" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" data-t="${x.t}" data-i0="${i0}" data-end="${end}">${g}</svg>`, mn, mx };
}
// 현재 상태 요약: 주가-구름 위치, 전환/기준, 후행스팬, 26일 뒤 구름
function ichiStatus(x, ich) {
  const c = x.spark, n = c.length, last = c[n - 1], out = [];
  const a = ich.A[n - 1], b = ich.B[n - 1];
  if (a != null && b != null) {
    const top = Math.max(a, b), bot = Math.min(a, b);
    out.push(last > top ? ["주가 구름 위", "u"] : last < bot ? ["주가 구름 아래", "d"] : ["주가 구름 속", ""]);
  }
  const t = ich.tenkan[n - 1], k = ich.kijun[n - 1];
  if (t != null && k != null) out.push(t > k ? ["전환선 > 기준선", "u"] : t < k ? ["전환선 < 기준선", "d"] : ["전환선 = 기준선", ""]);
  if (n > 26) out.push(last > c[n - 27] ? ["후행스팬 > 26일 전 주가", "u"] : ["후행스팬 < 26일 전 주가", "d"]);
  const fa = ich.A[n + 25], fb = ich.B[n + 25];
  if (fa != null && fb != null) out.push(fa >= fb ? ["26일 뒤 양운", "u"] : ["26일 뒤 음운", "d"]);

}

  if (!svg) { tip.style.display = "none"; return; }
  const x = byT[svg.dataset.t]; if (!x || !(x.dates || x.d0)) { return; }
  const s = seriesOf(x); if (s.v.length < 2) { tip.style.display = "none"; return; }
  const r = svg.getBoundingClientRect();
  const i = Math.max(0, Math.min(s.v.length - 1,
    Math.round((e.clientX - r.left) / r.width * (s.v.length - 1))));
  tip.innerHTML = `<b>${dateAt(x, s.i0 + i)}</b>$${fmt(s.v[i])}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 130) + "px";
  tip.style.top = (e.clientY - 40) + "px";
});
</script>
</body>
</html>
